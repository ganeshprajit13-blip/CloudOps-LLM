[pytest]
# Note: Most test files in tests/ are standalone scripts (run directly with python).
# They use check_*, run_* helper functions and have their own __main__ entry points.
# Run them directly: python tests/test_scenarios.py
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
