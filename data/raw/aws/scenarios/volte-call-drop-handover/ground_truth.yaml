scenario_id: volte-call-drop-handover
display_name: Call Drops During Handover
domain: Telecom
difficulty: hard
estimated_time_minutes: 45
hitl_scenario: true
hitl_clarification_type: change_correlation
hitl_flow:
  1_vague_report: "VoLTE call quality complaints increased 340% since March 30 in metro region; users report calls go silent during driving. All standard metrics (call success rate, tower capacity, coverage maps) appear normal."
  2_clarification: "Are all cell towers or regions affected equally? Were there any recent configuration changes or optimization exercises?"
  3_user_response: "Not all towers — complaints cluster at specific cell boundaries, but we haven't identified a common factor yet. The RF team ran a routine optimization recently and there was a firmware upgrade on some towers, but both were standard procedure."
  4_focused_investigation: "Agent searches network logs around the incident window for configuration changes, correlates with call failure events at affected boundaries, and traces the call lifecycle during handover attempts."
  5_correct_root_cause: "Aggressive 500ms handover timer causes indirect handover failures during vendor interop issues, leading to silent call drops with no signaling to IMS."
root_cause:
  service: mobility-controller
  issue: handover_prep_timer
  details: Handover preparation timer reduced from 2000ms to 500ms during routine optimization. When direct tower-to-tower
    handovers fail (chronic vendor interop issue), fallback to indirect handover through mobility controller requires ~800ms
    but times out at 500ms. Phone stays on original tower, drives out of range, call drops silently with no drop record generated.
evidence_keywords:
- handover_prep_timer
- HANDOVER_PREP_TIMEOUT
- Ericsson→Nokia
- CDR missing
- signal degradation -95 to -128 dBm
- voice session active after radio disconnect
- March 29 configuration change
red_herrings:
- Nokia firmware upgrade (March 26)
- Chronic 18% direct handover rejection rate
- P-CSCF upgrade (March 25)
- Network gateway bearer release spikes
- 30-minute session timer configuration
- CDR system bug
contributing_factors:
- Chronic direct handover failure between different vendor towers (18% rate)
- Voice system and radio system decoupling (no SIP BYE sent on radio loss)
- Call drop records only generated by voice signaling, not radio events
verification_steps:
- Correlate HANDOVER_PREP_TIMEOUT events with missing CDR records
- Compare handover timing for same-vendor vs cross-vendor boundaries
- Trace signal strength degradation after failed handovers
- Validate that affected calls stay "active" in voice system despite radio disconnect
fix_recommendations:
- Revert handover_prep_timer to 2000ms immediately
- Implement alerting on HANDOVER_PREP_TIMEOUT events at INFO level when volume exceeds threshold
- Add correlation rule to detect calls with radio disconnect but no SIP BYE
- Introduce vendor-specific handover timeout tuning policies
- Enhance CDR generation to include radio-level disconnect events as potential call drop triggers
plain_english_summary: Phone calls are dropping mid-conversation for mobile users, with complaints up 340% in the metro region.
  The issue only affects users moving between cell towers from different vendors. A routine network optimization shortened
  a critical handover timer, but several recent changes make the real cause hard to spot.
causation_chain:
- step: Network optimization reduces handover timer from 2s to 0.5s
  service: mobility-controller
- step: Cross-vendor tower handovers start timing out
  service: cell-tower
- step: Calls silently drop when users move between coverage areas
  service: voice-proxy
- step: No drop records appear in call detail system
  service: call-records
